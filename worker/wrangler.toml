name = "askduart-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "9b4f7f5830db4a3a8af714e533bcccd7"
preview_id = "9f534e6057f24fab96b5ec1475f9daca"

[ai]
binding = "AI"

[vars]
# Comma-separated list of origins allowed to call this Worker.
ALLOWED_ORIGINS = "https://duartkasapolli.com,https://www.duartkasapolli.com,http://localhost:5173,http://127.0.0.1:5173"
RATE_LIMIT_MAX = "18"
RATE_LIMIT_WINDOW_SECONDS = "3600"

# No AI provider API key needed — Workers AI runs on the Cloudflare account's
# own free daily allocation via the [ai] binding above.
